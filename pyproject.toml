[project]
name = "cadastro-cliente"
version = "0.1.0"
description = "Módulo de cadastro de cliente (Spec Kit - feature 001-cadastro-cliente)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadastro_cliente"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: testes que exigem PostgreSQL (Docker)"]
